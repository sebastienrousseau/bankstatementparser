name: Quality Gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"

      - name: Install dependencies
        run: poetry install --with dev -E excel

      - name: Ruff
        run: poetry run ruff check bankstatementparser tests examples scripts benches

      - name: Ruff format
        run: poetry run ruff format --check bankstatementparser tests examples scripts

      - name: Mypy
        run: poetry run mypy bankstatementparser

  lint-and-typecheck-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the lint-and-typecheck matrix, so adding or dropping a version never
    # renames a required check.
    name: Lint and Type Check (all)
    if: always()
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.lint-and-typecheck.result }}
        run: test "$RESULT" = success

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Full version sweep on Linux; macOS and Windows run the
      # version bounds (oldest + newest) to catch platform issues
      # without tripling the matrix.
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: "macos-latest"
            python-version: "3.10"
          - os: "macos-latest"
            python-version: "3.14"
          - os: "windows-latest"
            python-version: "3.10"
          - os: "windows-latest"
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"

      - name: Install dependencies
        run: poetry install --with dev -E excel

      - name: Run unit and package-quality suite
        # Collect everything under tests/ for unit coverage. Integration
        # tests that don't drive package coverage run in a separate job
        # without coverage; the pytest-benchmark suite is excluded here
        # because it requires baseline files and is not part of the
        # coverage gate. ``test_zip_security.py`` lives under integration/
        # but exercises ``bankstatementparser.zip_security`` directly, so
        # it stays in the coverage run.
        shell: bash
        run: |
          poetry run pytest tests/ \
            --ignore=tests/integration/test_malformed_data.py \
            --ignore=tests/integration/test_security_boundaries.py \
            --ignore=tests/integration/test_supply_chain_tools.py \
            --ignore=tests/test_benchmark_suite.py

  unit-tests-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the unit-tests matrix, so adding or dropping a version never
    # renames a required check.
    name: Unit Tests (all)
    if: always()
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.unit-tests.result }}
        run: test "$RESULT" = success

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"

      - name: Install dependencies
        run: poetry install --with dev -E excel

      - name: Run integration regression suite
        run: |
          poetry run pytest --no-cov tests/integration tests/test_enterprise_coverage.py

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: poetry run python benches/bench_deduplicate.py --quick

      - name: Run performance contracts (slow suite)
        # Timing-sensitive tests are excluded from the coverage run
        # (`-m "not slow"` in pyproject addopts) so they don't flake
        # under coverage instrumentation. The CLI -m overrides it.
        run: |
          poetry run pytest --no-cov -m slow tests/test_performance_contracts.py

  integration-tests-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the integration-tests matrix, so adding or dropping a version never
    # renames a required check.
    name: Integration Tests (all)
    if: always()
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.integration-tests.result }}
        run: test "$RESULT" = success

  platform-parity:
    name: Platform Parity
    runs-on: ${{ matrix.os }}
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"

      - name: Install dependencies
        run: poetry install --with dev -E excel

      - name: Run cross-platform smoke suite
        shell: bash
        run: >
          poetry run pytest --no-cov
          tests/test_camt_parser.py
          tests/test_pain001_parser.py
          tests/test_cli.py
          tests/integration/test_supply_chain_tools.py

  platform-parity-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the platform-parity matrix, so adding or dropping a version never
    # renames a required check.
    name: Platform Parity (all)
    if: always()
    needs: platform-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.platform-parity.result }}
        run: test "$RESULT" = success

  benchmarks:
    name: Benchmark Regression (non-blocking)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"

      - name: Install dependencies
        run: poetry install --with dev -E excel

      - name: Restore benchmark baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-py312
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-py312

      - name: Run benchmarks and compare against baseline
        # Non-blocking by design: shared-runner timing variance makes a
        # hard gate too flaky. A >25% mean regression shows up as a
        # failed step annotation for humans to investigate.
        continue-on-error: true
        run: |
          if compgen -G ".benchmarks/*/*.json" > /dev/null; then
            poetry run pytest --no-cov tests/test_benchmark_suite.py \
              --benchmark-only --benchmark-autosave \
              --benchmark-compare --benchmark-compare-fail=mean:25%
          else
            echo "No baseline found; recording first benchmark run."
            poetry run pytest --no-cov tests/test_benchmark_suite.py \
              --benchmark-only --benchmark-autosave
          fi

      - name: Save benchmark baseline
        # Only main-branch pushes refresh the baseline, so PRs are
        # compared against the last known-good main run.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-py312-${{ github.run_id }}

  llm-eval:
    name: LLM Accuracy Eval (non-blocking)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"

      - name: Install dependencies
        run: poetry install --with dev -E hybrid

      - name: Harness self-check (mock mode, no model)
        # Deterministic: loads every ground-truth case, runs the full
        # extract -> score -> report path against perfect mock answers.
        # A failure here means the harness itself broke.
        run: poetry run python scripts/run_llm_eval.py --mock

      - name: Run accuracy eval against configured model
        # Gated on the BSP_EVAL_MODEL repository variable so forks and
        # model-less runs skip silently. Non-blocking by design:
        # accuracy drift surfaces as a failed-step annotation for
        # humans, it never blocks a merge.
        if: vars.BSP_EVAL_MODEL != ''
        continue-on-error: true
        env:
          BSP_HYBRID_MODEL: ${{ vars.BSP_EVAL_MODEL }}
          BSP_HYBRID_API_BASE: ${{ secrets.BSP_EVAL_API_BASE }}
        run: poetry run python scripts/run_llm_eval.py

  optional-integrations:
    name: Real API and Parquet (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"
      - name: Install locked optional dependencies
        run: poetry install --with dev -E api -E parquet -E hybrid
      - name: Verify optional imports and regressions
        run: |
          poetry run python -c "import fastapi, python_multipart, httpx, pyarrow, pypdf"
          poetry run pytest --no-cov tests/test_audit_regressions.py tests/test_api.py tests/test_parquet_export.py tests/test_export_privacy_streaming.py tests/test_forensics.py
      - name: Verify isolated installed wheel
        shell: bash
        run: |
          poetry build
          poetry run python scripts/export_locked_requirements.py --with dev -E api -E parquet -E hybrid --output "$RUNNER_TEMP/requirements-wheel.txt"
          python -m venv "$RUNNER_TEMP/bsp-wheel"
          "$RUNNER_TEMP/bsp-wheel/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/requirements-wheel.txt"
          "$RUNNER_TEMP/bsp-wheel/bin/python" -m pip install --no-deps dist/bankstatementparser-*.whl
          "$RUNNER_TEMP/bsp-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/bsp-wheel/bin/python" -I scripts/verify_installed_wheel.py --expected-version "$(poetry version --short)"

  optional-integrations-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the optional-integrations matrix, so adding or dropping a version never
    # renames a required check.
    name: Real API and Parquet (all)
    if: always()
    needs: optional-integrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.optional-integrations.result }}
        run: test "$RESULT" = success

  required-quality:
    name: Required Quality Gates
    if: always()
    needs: [lint-and-typecheck, unit-tests, integration-tests, platform-parity, optional-integrations]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful quality jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required jobs did not succeed: " + ", ".join(failed))
          PYTHON
