name: Security

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  python-security:
    name: Python Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "2.3.2"

      - name: Install project and audit tools
        run: |
          poetry install --with dev
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Verify lockfile hashes
        run: poetry run python scripts/verify_locked_hashes.py

      - name: Verify hashed dependency export
        run: |
          poetry run python scripts/export_locked_requirements.py --with dev --output /tmp/requirements-hashed.txt
          diff -u requirements.txt /tmp/requirements-hashed.txt
          python -m pip install --dry-run --require-hashes -r /tmp/requirements-hashed.txt

      - name: Bandit SAST
        run: |
          poetry run bandit -r bankstatementparser examples scripts -c pyproject.toml

      - name: Generate SBOM
        run: |
          poetry run python scripts/generate_sbom.py \
            --output /tmp/sbom.cyclonedx.json \
            --markdown-output /tmp/dependency-report.md
          poetry run python scripts/validate_sbom.py /tmp/sbom.cyclonedx.json

      - name: Pip audit
        # The all-extras audit ignores two filelock advisories, and only those:
        # GHSA-69hj-f68j-2879 (CVE-2026-112909) and GHSA-8mx5-7m5m-r77g
        # (CVE-2026-112910), fixed in filelock 4.2.1. Both need a local user
        # who can write to the lock directory; neither is reachable remotely.
        # filelock comes in only through litellm in the optional hybrid and
        # enrichment extras, and every litellm release up to 1.109.0.dev2
        # requires filelock < 4. litellm's main branch already allows < 5, so
        # the next release lifts the cap: then raise filelock to >= 4.2.1 in
        # pyproject.toml and delete this ignore. The date check fails the job
        # on REVIEW_BY so the ignore cannot outlive its reason.
        env:
          REVIEW_BY: "2026-12-01"
        run: |
          if [[ "$(date -u +%F)" > "$REVIEW_BY" || "$(date -u +%F)" == "$REVIEW_BY" ]]; then
            echo "::error::The filelock advisory ignore expired on $REVIEW_BY: check for a litellm release that allows filelock 4."
            exit 1
          fi
          poetry run python scripts/export_locked_requirements.py --with dev --output /tmp/requirements-audit.txt
          pip-audit -r /tmp/requirements-audit.txt
          poetry run python scripts/export_locked_requirements.py --with dev --all-extras --output /tmp/requirements-all-extras.txt
          pip-audit -r /tmp/requirements-all-extras.txt \
            --ignore-vuln GHSA-69hj-f68j-2879 \
            --ignore-vuln GHSA-8mx5-7m5m-r77g
